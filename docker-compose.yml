version: '3.9'

services:
  db:
    image: postgres:16
    container_name: smartstick-postgres
    restart: always
    environment:
      POSTGRES_DB: smartstick_db
      POSTGRES_USER: smartstick
      POSTGRES_PASSWORD: smartstick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
