<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Stick Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Smart Stick</p>
        <h1>Caregiver Dashboard</h1>
      </div>
    </header>

    <nav class="main-nav">
      <a href="index.html" class="active">Overview</a>
      <a href="devices.html">Devices</a>
      <a href="alerts.html">Alerts</a>
      <a href="settings.html">Settings</a>
    </nav>

    <main class="dashboard">
      <section class="stats-grid">
        <div class="card metric">
          <span class="label">Total devices</span>
          <strong id="totalDevices">0</strong>
        </div>
        <div class="card metric">
          <span class="label">Online</span>
          <strong id="onlineDevices">0</strong>
        </div>
        <div class="card metric">
          <span class="label">Offline</span>
          <strong id="offlineDevices">0</strong>
        </div>
        <div class="card metric">
          <span class="label">Battery</span>
          <strong id="batteryHealth">0%</strong>
        </div>
      </section>

      <section class="panel-grid">
        <div class="card">
          <h2>Recent obstacle events</h2>
          <ul id="recentEvents" class="list"></ul>
        </div>

        <div class="card">
          <h2>Recent emergency alerts</h2>
          <ul id="recentAlerts" class="list"></ul>
        </div>
      </section>
    </main>

    <script src="js/dashboard.js"></script>
  </body>
</html>
