<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Stick Settings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Smart Stick</p>
        <h1>Device Settings</h1>
      </div>
    </header>

    <nav class="main-nav">
      <a href="index.html">Overview</a>
      <a href="devices.html">Devices</a>
      <a href="alerts.html">Alerts</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>

    <main class="content-page">
      <form id="settingsForm" class="settings-form">
        <label>
          Obstacle Threshold (cm)
          <input type="number" name="obstacle_threshold" value="80" />
        </label>
        <label>
          Buzzer Enabled
          <input type="checkbox" name="buzzer_enabled" checked />
        </label>
        <label>
          Vibration Enabled
          <input type="checkbox" name="vibration_enabled" checked />
        </label>
        <label>
          Emergency Contact
          <input type="tel" name="emergency_contact_number" value="+1234567890" />
        </label>
        <label>
          Notification Preferences
          <select name="notification_preferences">
            <option value="sms">SMS</option>
            <option value="app">App</option>
            <option value="both">SMS + App</option>
          </select>
        </label>
        <button type="submit">Save Settings</button>
      </form>
    </main>

    <script src="js/settings.js"></script>
  </body>
</html>
